<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일일 습관 & 주간 스트릭 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
    .check-anim { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .check-anim:active { transform: scale(0.85); }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen py-8 px-4 sm:px-6 lg:px-8">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- 상단 헤더 & 날짜 정보 -->
    <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <div class="flex items-center gap-2 text-indigo-600 font-semibold text-sm mb-1">
          <i class="fa-solid fa-calendar-check"></i>
          <span id="current-date-display">2026년 10월 14일 (수)</span>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">주간 습관 트래커</h1>
      </div>
      <div class="flex items-center gap-3 self-end sm:self-auto">
        <button onclick="resetWeek()" class="text-xs font-medium text-slate-500 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 px-3.5 py-2 rounded-xl transition">
          <i class="fa-solid fa-rotate-right mr-1"></i>주간 기록 초기화
        </button>
      </div>
    </header>

    <!-- 요약 통계 카드 (3단) -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-400 uppercase">오늘 달성률</p>
          <p id="today-rate" class="text-2xl font-bold text-slate-900 mt-1">0%</p>
          <p id="today-count" class="text-xs text-slate-500 mt-0.5">0 / 0 완료</p>
        </div>
        <div class="w-12 h-12 rounded-2xl bg-indigo-50 flex items-center justify-center text-indigo-600 text-xl">
          <i class="fa-solid fa-bullseye"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-400 uppercase">주간 전체 진행률</p>
          <p id="weekly-rate" class="text-2xl font-bold text-slate-900 mt-1">0%</p>
          <div class="w-32 h-2 bg-slate-100 rounded-full mt-2 overflow-hidden">
            <div id="weekly-progress-bar" class="h-full bg-indigo-600 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
        <div class="w-12 h-12 rounded-2xl bg-emerald-50 flex items-center justify-center text-emerald-600 text-xl">
          <i class="fa-solid fa-chart-line"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-400 uppercase">최고 연속 달성 (Streak)</p>
          <p id="best-streak" class="text-2xl font-bold text-orange-500 mt-1">0일 🔥</p>
          <p class="text-xs text-slate-500 mt-0.5">이번 주 최장 스트릭</p>
        </div>
        <div class="w-12 h-12 rounded-2xl bg-orange-50 flex items-center justify-center text-orange-500 text-xl">
          <i class="fa-solid fa-fire"></i>
        </div>
      </div>
    </section>

    <!-- 새 습관 추가 폼 -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
      <form id="add-habit-form" class="flex flex-col sm:flex-row gap-3">
        <select id="habit-icon" class="bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="🐾">🐾 반려동물/산책</option>
          <option value="🏃">🏃 운동/건강</option>
          <option value="💬">💬 어학/스피킹</option>
          <option value="📖">📖 독서/인사이트</option>
          <option value="💧">💧 수분/영양제</option>
          <option value="💻">💻 개발/사이드프로젝트</option>
        </select>
        <input type="text" id="habit-title" placeholder="새로운 일일 목표를 입력하세요 (예: 아침 산책 30분, 비즈니스 영어 구문 연습)" required
          class="flex-1 bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-5 py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow-sm">
          <i class="fa-solid fa-plus"></i> 목표 추가
        </button>
      </form>
    </section>

    <!-- 주간 습관 매트릭스 테이블 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-200 bg-slate-50/60 text-xs font-semibold text-slate-500 uppercase">
              <th class="py-4 px-6 min-w-[220px]">일일 목표</th>
              <th class="py-4 px-2 text-center w-14 day-header" data-day="0">월</th>
              <th class="py-4 px-2 text-center w-14 day-header" data-day="1">화</th>
              <th class="py-4 px-2 text-center w-14 day-header" data-day="2">수</th>
              <th class="py-4 px-2 text-center w-14 day-header" data-day="3">목</th>
              <th class="py-4 px-2 text-center w-14 day-header" data-day="4">금</th>
              <th class="py-4 px-2 text-center w-14 day-header text-rose-500" data-day="5">토</th>
              <th class="py-4 px-2 text-center w-14 day-header text-rose-500" data-day="6">일</th>
              <th class="py-4 px-4 text-center w-28">연속 달성</th>
              <th class="py-4 px-4 text-center w-28">주간 달성률</th>
              <th class="py-4 px-4 text-center w-14">관리</th>
            </tr>
          </thead>
          <tbody id="habit-list" class="divide-y divide-slate-200/70 text-sm">
            <!-- 자바스크립트로 렌더링 -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    // 요일 인덱스 계산 (월요일 = 0, 일요일 = 6)
    const now = new Date();
    const jsDay = now.getDay(); // 0(일) ~ 6(토)
    const todayIndex = jsDay === 0 ? 6 : jsDay - 1; 

    // 상단 날짜 표시 업데이트
    const dayNames = ['월', '화', '수', '목', '금', '토', '일'];
    document.getElementById('current-date-display').textContent = 
      `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 (${dayNames[todayIndex]})`;

    // 초기 샘플 데이터
    const defaultHabits = [
      { id: 1, icon: '🐾', title: '아침 반려견 산책 및 양치 케어', checks: [true, true, true, false, false, false, false] },
      { id: 2, icon: '💬', title: '비즈니스 영어 스피킹 15분 연습', checks: [true, true, false, false, false, false, false] },
      { id: 3, icon: '🏃', title: '애플워치 활동 링 모두 채우기', checks: [false, true, true, false, false, false, false] },
      { id: 4, icon: '📖', title: '잠들기 전 독서 또는 아티클 클리핑 리뷰', checks: [true, true, true, false, false, false, false] }
    ];

    let habits = JSON.parse(localStorage.getItem('weekly_habits_v1')) || defaultHabits;

    function saveHabits() {
      localStorage.setItem('weekly_habits_v1', JSON.stringify(habits));
    }

    // 연속 달성(Streak) 계산 함수: 오늘(또는 가장 최근 체크된 날) 기준 연속 일수 및 주간 최대 연속 일수 산출
    function calculateStreak(checks) {
      let currentStreak = 0;
      let maxStreak = 0;
      let tempStreak = 0;

      for (let i = 0; i < 7; i++) {
        if (checks[i]) {
          tempStreak++;
          if (tempStreak > maxStreak) maxStreak = tempStreak;
        } else {
          tempStreak = 0;
        }
      }

      // 오늘 기준 역산 스트릭 (오늘 아직 안 했으면 어제까지 연속 기록 유지로 표시)
      let checkIndex = checks[todayIndex] ? todayIndex : todayIndex - 1;
      while (checkIndex >= 0 && checks[checkIndex]) {
        currentStreak++;
        checkIndex--;
      }

      return { currentStreak, maxStreak };
    }

    // 대시보드 렌더링
    function renderDashboard() {
      const tbody = document.getElementById('habit-list');
      tbody.innerHTML = '';

      // 오늘 요일 헤더 강조
      document.querySelectorAll('.day-header').forEach((th, idx) => {
        if (idx === todayIndex) {
          th.classList.add('bg-indigo-50/80', 'text-indigo-600', 'font-bold');
          th.innerHTML = `${dayNames[idx]}<span class="block text-[10px] text-indigo-500 font-normal">오늘</span>`;
        }
      });

      let todayCompleted = 0;
      let totalChecks = 0;
      let highestStreak = 0;

      if (habits.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="11" class="py-12 text-center text-slate-400">
              등록된 일일 목표가 없습니다. 상단 입력창에서 새 목표를 추가해 보세요!
            </td>
          </tr>`;
      }

      habits.forEach((habit) => {
        if (habit.checks[todayIndex]) todayCompleted++;
        const completedCount = habit.checks.filter(Boolean).length;
        totalChecks += completedCount;

        const { currentStreak, maxStreak } = calculateStreak(habit.checks);
        if (maxStreak > highestStreak) highestStreak = maxStreak;

        const weeklyPercent = Math.round((completedCount / 7) * 100);

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50/80 transition';

        let dayCells = '';
        for (let d = 0; d < 7; d++) {
          const isChecked = habit.checks[d];
          const isToday = d === todayIndex;
          dayCells += `
            <td class="py-3.5 px-2 text-center ${isToday ? 'bg-indigo-50/40' : ''}">
              <button onclick="toggleCheck(${habit.id}, ${d})" 
                class="check-anim w-8 h-8 rounded-xl flex items-center justify-center mx-auto border transition ${
                  isChecked 
                    ? 'bg-indigo-600 border-indigo-600 text-white shadow-sm shadow-indigo-200' 
                    : 'bg-white border-slate-200 text-transparent hover:border-indigo-400'
                }">
                <i class="fa-solid fa-check text-xs"></i>
              </button>
            </td>`;
        }

        tr.innerHTML = `
          <td class="py-3.5 px-6 font-medium text-slate-800">
            <div class="flex items-center gap-2.5">
              <span class="text-lg">${habit.icon}</span>
              <span class="truncate">${habit.title}</span>
            </div>
          </td>
          ${dayCells}
          <td class="py-3.5 px-4 text-center">
            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold ${
              currentStreak > 0 ? 'bg-orange-50 text-orange-600' : 'bg-slate-100 text-slate-400'
            }">
              🔥 ${currentStreak}일 연속
            </span>
          </td>
          <td class="py-3.5 px-4">
            <div class="flex items-center gap-2">
              <div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full bg-emerald-500 rounded-full transition-all duration-300" style="width: ${weeklyPercent}%"></div>
              </div>
              <span class="text-xs font-semibold text-slate-600 w-8 text-right">${completedCount}/7</span>
            </div>
          </td>
          <td class="py-3.5 px-4 text-center">
            <button onclick="deleteHabit(${habit.id})" class="text-slate-300 hover:text-rose-500 transition px-2 py-1" title="삭제">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // 상단 요약 지표 업데이트
      const totalHabits = habits.length;
      const todayRate = totalHabits ? Math.round((todayCompleted / totalHabits) * 100) : 0;
      const weeklyRate = totalHabits ? Math.round((totalChecks / (totalHabits * 7)) * 100) : 0;

      document.getElementById('today-rate').textContent = `${todayRate}%`;
      document.getElementById('today-count').textContent = `${todayCompleted} / ${totalHabits} 완료`;
      document.getElementById('weekly-rate').textContent = `${weeklyRate}%`;
      document.getElementById('weekly-progress-bar').style.width = `${weeklyRate}%`;
      document.getElementById('best-streak').textContent = `${highestStreak}일 🔥`;
    }

    // 요일 체크 토글
    function toggleCheck(habitId, dayIdx) {
      const habit = habits.find(h => h.id === habitId);
      if (habit) {
        habit.checks[dayIdx] = !habit.checks[dayIdx];
        saveHabits();
        renderDashboard();
      }
    }

    // 새 습관 추가
    document.getElementById('add-habit-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const icon = document.getElementById('habit-icon').value;
      const titleInput = document.getElementById('habit-title');
      const title = titleInput.value.trim();

      if (title) {
        habits.push({
          id: Date.now(),
          icon: icon,
          title: title,
          checks: [false, false, false, false, false, false, false]
        });
        titleInput.value = '';
        saveHabits();
        renderDashboard();
      }
    });

    // 습관 삭제
    function deleteHabit(habitId) {
      habits = habits.filter(h => h.id !== habitId);
      saveHabits();
      renderDashboard();
    }

    // 주간 기록 초기화
    function resetWeek() {
      if (confirm('이번 주 체크 기록을 모두 초기화하시겠습니까? (목표 목록은 유지됩니다)')) {
        habits.forEach(h => h.checks = [false, false, false, false, false, false, false]);
        saveHabits();
        renderDashboard();
      }
    }

    // 최초 실행
    renderDashboard();
  </script>
</body>
</html>
